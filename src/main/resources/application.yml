spring:
  application:
    name: pre-trade-compliance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USER:compliance}
    password: ${DB_PASSWORD:compliance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

compliance:
  security:
    # No default on purpose: the service must fail to start without a real signing secret. See
    # SecurityConfig.jwtSigningKey, application-local.yml (dev-only value) and
    # src/test/resources/application-test.yml (test-only value).
    jwt-secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: pre-trade-compliance-service
  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USER:compliance}
    password: ${DB_PASSWORD:compliance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      # Off by default in Spring Boot: without it, an ErrorResponseException a controller throws
      # (limits.LimitChangeProblems, orders.OrdersProblems) only gets its status code applied --
      # DefaultHandlerExceptionResolver calls response.sendError() and lets the servlet container's
      # own /error page (Boot's BasicErrorController, a plain {"timestamp",...,"status","error",
      # "path"} body) render instead of writing our ProblemDetail as application/problem+json. Spec
      # 3.6 requires every error to actually BE a ProblemDetail body, not just carry the right
      # status code -- found while body-asserting orders.OrderIntakeHttpTest's 400 case; the same
      # gap silently affected every 404/409/422 limits.LimitChangeController already returns, none
      # of which had a test checking response body content before this.
      enabled: true

compliance:
  security:
    # No default on purpose: the service must fail to start without a real signing secret. See
    # SecurityConfig.jwtSigningKey, application-local.yml (dev-only value) and
    # src/test/resources/application-test.yml (test-only value).
    jwt-secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

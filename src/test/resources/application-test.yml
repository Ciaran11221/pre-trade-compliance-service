spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # test profile only: LimitChangeScenarioTest and LimitChangeConcurrentApprovalTest call
    # Flyway.clean() + migrate() between scenarios to reset to the seeded state, since the
    # limit-change audit tables are insert-only and cannot be reset with DELETE. Flyway defaults
    # clean-disabled to true as a production safeguard; this profile only ever runs against a
    # disposable Testcontainers database.
    clean-disabled: false

compliance:
  security:
    # test profile only. TokenTool's CLI signs with the local-dev secret, not this one -- tests
    # that need a signed token call TokenTool.signedToken(...) themselves with this exact value
    # (see support/TokenTool.java).
    jwt-secret: test-only-secret-9f3c2b7a1e6d4508b0c7d2a4e9f61c3b
  quarantine:
    expiry-job:
      # test profile only (M7b, issue #14): QuarantineSchedulingConfig is @ConditionalOnProperty on
      # this key, so no test ever races a background @Scheduled trigger of QuarantineExpiryJob --
      # tests call runExpiry() directly instead (see QuarantineExpiryJobTest).
      enabled: false

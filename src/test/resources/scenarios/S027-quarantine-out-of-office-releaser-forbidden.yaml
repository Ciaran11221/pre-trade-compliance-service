id: S027
title: An out-of-office SUPERVISOR may not release or reject a quarantine
kind: quarantine
covers: [quarantine:out-of-office-releaser]
given:
  outOfOffice:
    - {staffId: sup-1, from: "2025-12-01T00:00:00Z", until: "2026-02-01T00:00:00Z"}
then:
  outcome: "403, out-of-office releaser forbidden"
  note: >
    sup-1 is marked out of office spanning the whole scenario. Not the sender, but out of office,
    so release is refused just as an out-of-office limit-change approver is (S020): their token
    may be stolen.
steps:
  - actor: anne
    roles: [TRADER]
    action: submit-order
    fields: {side: BUY, ticker: KSTL, quantity: 1000, ref: o1}
    expect: {httpStatus: 201, resultStatus: PASS}
  - actor: brian
    roles: [TRADER]
    action: submit-order
    fields: {side: BUY, ticker: KSTL, quantity: 1050, ref: o2}
    expect: {httpStatus: 201, resultStatus: QUARANTINED}
  - actor: sup-1
    roles: [SUPERVISOR]
    action: release
    fields: {ref: o2}
    expect: {httpStatus: 403}

id: S002
title: Fund at 28.5 percent in over-5% positions blocks
kind: rule
covers: [rule:diversification]
given:
  settings: {}
  fund: {code: WVF, totalAssets: "1000000000", cash: "100000000", diversified: true}
  securities:
    - {ticker: KSTL, price: "100", votingSharesOutstanding: 50000000, avgDailyVolume: 2000000}
    - {ticker: TDRA, price: "200", votingSharesOutstanding: 45000000, avgDailyVolume: 1800000}
    - {ticker: QSTN, price: "460", votingSharesOutstanding: 25000000, avgDailyVolume: 900000}
  holdings:
    - {ticker: KSTL, quantity: 450000}
    - {ticker: TDRA, quantity: 575000}
    - {ticker: QSTN, quantity: 250000}
  restricted: []
  pendingOrders: []
when:
  order: {side: BUY, ticker: KSTL, quantity: 100000}
then:
  outcome: BLOCK
  rules: {diversification: BLOCK}
  note: >
    KSTL 450,000 sh x $100 = $45,000,000, which is 4.5% of $1,000,000,000, under 5%.
    TDRA 575,000 sh x $200 = $115,000,000 and QSTN 250,000 sh x $460 = $115,000,000,
    both already over 5%, summing to $230,000,000 in the over-5% group.
    The BUY is 100,000 KSTL sh x $100 = $10,000,000, taking KSTL to $55,000,000,
    which is 5.5% of $1,000,000,000, so KSTL crosses 5% and joins the group.
    New over-5% total = $230,000,000 + $55,000,000 = $285,000,000, which is 28.5%
    of $1,000,000,000, over the 25% limit, so BLOCK.

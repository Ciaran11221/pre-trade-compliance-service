id: S005
title: Buy that fits cash alone but not after a pending buy blocks
kind: rule
covers: [rule:cash]
given:
  settings: {}
  fund: {code: HGF, totalAssets: "1000000000", cash: "10000000", diversified: true}
  securities:
    - {ticker: KSTL, price: "100", votingSharesOutstanding: 50000000, avgDailyVolume: 2000000}
    - {ticker: NRTH, price: "150", votingSharesOutstanding: 40000000, avgDailyVolume: 1500000}
  holdings: []
  restricted: []
  pendingOrders:
    - {side: BUY, ticker: NRTH, quantity: 40000}
when:
  order: {side: BUY, ticker: KSTL, quantity: 50000}
then:
  outcome: BLOCK
  rules: {cash: BLOCK}
  note: >
    Cash is $10,000,000. The new order alone is 50,000 KSTL sh x $100 =
    $5,000,000, which would fit within cash on its own. One pending BUY is
    already queued: 40,000 NRTH sh x $150 = $6,000,000. Cash left after the
    pending buy is $10,000,000 - $6,000,000 = $4,000,000. The new order's
    $5,000,000 exceeds that $4,000,000, so BLOCK.

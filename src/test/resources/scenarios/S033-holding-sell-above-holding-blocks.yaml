id: S033
title: Sell of more shares than the fund holds blocks
kind: rule
covers: [rule:holding]
given:
  settings: {}
  fund: {code: HGF, totalAssets: "1000000000", cash: "100000000", diversified: false}
  securities:
    - {ticker: KSTL, price: "100", votingSharesOutstanding: 50000000, avgDailyVolume: 20000000}
  holdings:
    - {ticker: KSTL, quantity: 450000}
  restricted: []
  pendingOrders: []
when:
  order: {side: SELL, ticker: KSTL, quantity: 1000000}
then:
  outcome: BLOCK
  rules: {holding: BLOCK}
  note: >
    HGF holds 450,000 KSTL and has no pending sells of it, so 450,000 shares are available. The
    order sells 1,000,000, which exceeds the 450,000 available, so BLOCK.

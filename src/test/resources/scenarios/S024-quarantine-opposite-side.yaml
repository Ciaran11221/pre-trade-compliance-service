id: S024
title: An opposite-side order within the lookback window is quarantined
kind: quarantine
covers: [quarantine:opposite-side]
then:
  outcome: "brian's sell is quarantined as opposite-side to anne's buy"
  note: >
    Anne buys KSTL; brian sells KSTL moments later on the same fund and security. Opposite side
    within LOOKBACK_MINUTES quarantines brian's order regardless of quantity.
steps:
  - actor: anne
    roles: [TRADER]
    action: submit-order
    fields: {side: BUY, ticker: KSTL, quantity: 1000, ref: o1}
    expect: {httpStatus: 201, resultStatus: PASS}
  - actor: brian
    roles: [TRADER]
    action: submit-order
    fields: {side: SELL, ticker: KSTL, quantity: 500, ref: o2}
    expect: {httpStatus: 201, resultStatus: QUARANTINED, quarantineReason: OPPOSITE_SIDE}

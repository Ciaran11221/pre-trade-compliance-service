name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify
      - name: Confirm TokenTool did not ship in the jar
        run: |
          if unzip -l target/*.jar | grep -q TokenTool; then echo "TokenTool must not ship in the jar"; exit 1; fi

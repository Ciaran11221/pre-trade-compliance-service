name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check commit messages for banned words
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%B origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} --no-merges | sh .githooks/check-writing.sh
      - run: ./mvnw -B verify
      - name: Confirm TokenTool did not ship in the jar
        run: |
          if unzip -l target/*.jar | grep -q TokenTool; then echo "TokenTool must not ship in the jar"; exit 1; fi
